name: Free Games Radar

on:
  schedule:
    # UTC 01:17, 07:17, 13:17, 19:17 = 北京 09:17、15:17、21:17、次日 03:17
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式（test=测试Bark，scan=扫描免费游戏）"
        required: true
        type: choice
        default: scan
        options:
          - scan
          - test

permissions:
  contents: write

concurrency:
  group: freegame-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Offline tests
        run: python -m unittest discover -s tests -v

      - name: Test Bark notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test' }}
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python radar.py --test-push

      - name: Scan free games and notify
        if: ${{ github.event_name == 'schedule' || inputs.mode != 'test' }}
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          EPIC_COUNTRY: ${{ vars.EPIC_COUNTRY || 'CN' }}
          EPIC_LOCALE: ${{ vars.EPIC_LOCALE || 'zh-CN' }}
          MAX_PUSH: ${{ vars.MAX_PUSH || '8' }}
        run: python radar.py

      - name: Commit updated state and game list
        if: ${{ github.event_name == 'schedule' || inputs.mode != 'test' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/sent.json data/current.json FREE_GAMES.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh free game radar state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
